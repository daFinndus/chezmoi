# Global settings
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 15
    on-timeout = notify-send "Hypridle" "Going to lock the device in 15 seconds!"
  }

# Lock screen after 30 seconds of doing nothing
listener {
    timeout = 30
    on-timeout = hyprlock
}

# Turn off screen after 2,5 minutes
listener {
    timeout = 150
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend device after 5 minutes
listener {
    timeout = 300
    on-timeout = systemctl suspend
}
